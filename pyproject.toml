[project]
name = "supplier_invoice_importer"
authors = [
    { name = "Andrii Snialyi", email = "andrey.welcome.ua@gmail.com" },
]
description = "Import supplier invoices into ERPNext"
requires-python = ">=3.10"
readme = "README.md"
license = { file = "license.txt" }
dynamic = ["version"]
dependencies = []

[build-system]
requires = ["flit_core >=3.4,<4"]
build-backend = "flit_core.buildapi"

[tool.bench.frappe-dependencies]
frappe = ">=16.30.0,<17.0.0"
erpnext = ">=16.31.0,<17.0.0"
